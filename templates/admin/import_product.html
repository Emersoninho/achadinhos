<!-- templates/admin/import_product.html -->
{% extends "admin/base_site.html" %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <h1 style="margin-bottom: 20px;">
        <i class="fas fa-download"></i> Importar Produto
    </h1>
    
    <div style="background: #f8f9fa; padding: 20px; border-radius: 10px;">
        <form method="post">
            {% csrf_token %}
            
            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; margin-bottom: 5px; display: block;">
                    Link do Produto:
                </label>
                {{ form.url }}
            </div>
            
            <div style="margin-bottom: 20px;">
                <label style="font-weight: bold; margin-bottom: 5px; display: block;">
                    Plataforma:
                </label>
                {{ form.platform }}
            </div>
            
            <button type="submit" style="background: #667eea; color: #fff; border: none; padding: 10px 25px; border-radius: 25px; font-weight: bold; cursor: pointer;">
                <i class="fas fa-search"></i> Importar
            </button>
        </form>
    </div>
</div>
{% endblock %}
