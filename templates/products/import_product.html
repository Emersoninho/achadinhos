<!-- templates/products/import_product.html -->
{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h2 class="h5 mb-0">
                    <i class="fas fa-download"></i> Importar Produto
                </h2>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Link do Produto:</label>
                        {{ form.url }}
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Plataforma:</label>
                        {{ form.platform }}
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-search"></i> Importar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
